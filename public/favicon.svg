<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <defs>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Gateway Geometric Symbol -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="url(#gatewayGrad)" stroke-width="2" stroke-dasharray="32 14" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3" fill="#10b981"/>
  <!-- Orbit dot -->
  <circle cx="23" cy="11" r="1.5" fill="#38bdf8"/>
